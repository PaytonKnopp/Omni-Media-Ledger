name: Tests

# Manual only. This used to run on every pull request, and a red result emailed the owner each time.
# It no longer runs on its own: open the repository's Actions tab -> Tests -> "Run workflow" to run
# the full suite (lint, fast checks, browser suite, corpus gate) against any branch on demand.
#
# To bring automatic runs back, add `pull_request:` under `on:` below (and restore the PR-number
# concurrency group). If a Ruleset or branch protection requires the `test` status check, remove
# that requirement: a workflow that never runs on PRs would leave every PR waiting on it forever.
on:
  workflow_dispatch:

# One run per branch at a time: starting another while one is in progress cancels the older run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # A throwaway Postgres so test/schema.js runs its LIVE checks instead of skipping them.
    #
    # Without this the schema is only ever checked by reading schema.sql as text, and the two bugs
    # that file exists because of were both invisible that way: a BEFORE UPDATE trigger returning
    # OLD (every established account silently discarded every save), and an RLS policy filtering an
    # ON CONFLICT DO UPDATE (2xx, zero rows written, no error). Neither is a syntax problem, so
    # neither can be found without a real database applying the file and answering as `anon`.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        # Don't start the job until the server actually accepts connections.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      OMNI_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v5

      # Node 24 is the current LTS line; 20 reached end of life in April 2026. The v5 actions run
      # on Node 24 themselves, so the runner stops warning about a deprecated action runtime too.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # test/regression.js loads playwright-core (already a devDependency) and looks for a
      # Chromium binary at a few well-known paths -- installing it via the full `playwright`
      # package's CLI (without adding it as a project dependency) is the standard way to get
      # a matching browser build onto the runner.
      #
      # The installer version is pinned to whatever playwright-core actually resolved to, and that
      # is load-bearing rather than tidiness. Bare `npx --yes playwright install` fetches the
      # NEWEST playwright release, while playwright-core here is a caret range that resolves to
      # something older, and each release wants its own browser revision. The two agree right up
      # until Playwright ships a new version, and then CI fails on a commit that changed nothing:
      # the installer laid down chromium 1243 while playwright-core went looking for 1234, and the
      # run died at browserType.launch before a single check executed. Deriving the version means
      # they cannot drift apart again.
      - name: Install Chromium for Playwright
        run: npx --yes playwright@$(node -p "require('playwright-core/package.json').version") install --with-deps chromium

      # The live checks shell out to psql. The runner image ships the client already; this is the
      # cheap guard against a future image that doesn't, since a missing psql would otherwise fail
      # deep inside the schema checks rather than here with an obvious message.
      - name: Check psql is available
        run: psql --version

      - name: Run test suite
        run: npm test
