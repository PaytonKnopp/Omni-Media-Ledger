name: Tests

# Pull requests only, deliberately.
#
# This used to run on push AND pull_request, which meant every branch with an open PR ran the
# identical suite twice against effectively identical code -- the pull_request event tests a
# preview of the branch merged into master, and while a PR is up to date those are the same thing.
# The only thing the second run added was a second independent chance to hit a flaky check, so a
# green and a red would appear side by side for one commit and the red one was never a real
# failure. Testing the merge preview is the more useful of the two, so that is the one kept.
#
# Trade-off worth knowing: nothing now tests a commit pushed straight to master outside a PR. That
# is fine while every change lands through one, but if direct pushes to master ever become normal,
# add `push: { branches: [master] }` back.
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # A throwaway Postgres so test/schema.js runs its LIVE checks instead of skipping them.
    #
    # Without this the schema is only ever checked by reading schema.sql as text, and the two bugs
    # that file exists because of were both invisible that way: a BEFORE UPDATE trigger returning
    # OLD (every established account silently discarded every save), and an RLS policy filtering an
    # ON CONFLICT DO UPDATE (2xx, zero rows written, no error). Neither is a syntax problem, so
    # neither can be found without a real database applying the file and answering as `anon`.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        # Don't start the job until the server actually accepts connections.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      OMNI_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # test/regression.js loads playwright-core (already a devDependency) and looks for a
      # Chromium binary at a few well-known paths -- installing it via the full `playwright`
      # package's CLI (without adding it as a project dependency) is the standard way to get
      # a matching browser build onto the runner.
      - name: Install Chromium for Playwright
        run: npx --yes playwright install --with-deps chromium

      # The live checks shell out to psql. The runner image ships the client already; this is the
      # cheap guard against a future image that doesn't, since a missing psql would otherwise fail
      # deep inside the schema checks rather than here with an obvious message.
      - name: Check psql is available
        run: psql --version

      - name: Run test suite
        run: npm test
